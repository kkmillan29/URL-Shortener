<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>URL Shortener</h1>
            <p>Shorten your long URLs with just one click!</p>
        </header>

        <main>
            <div class="form-container">
                <form id="shortenForm">
                    <div class="input-group">
                        <input type="url" id="urlInput" placeholder="Enter your long URL here" required>
                        <button type="submit">Shorten</button>
                    </div>
                </form>
            </div>

            <div class="result-container" id="resultContainer" style="display: none;">
                <h2>Your Shortened URL</h2>
                <div class="result-box">
                    <input type="text" id="shortUrlResult" readonly>
                    <button id="copyButton">Copy</button>
                </div>
                <div class="original-url">
                    <p>Original URL: <span id="originalUrl"></span></p>
                </div>
            </div>

            <div class="metrics-container">
                <h2>Top Domains</h2>
                <div id="topDomains" class="top-domains">
                    <p>Loading metrics...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2023 URL Shortener Service</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
